name: privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Sensitive-field logging rules
        run: semgrep scan --error --metrics=off --config .semgrep/privacy.yml backend app
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy with logging macros disallowed
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
